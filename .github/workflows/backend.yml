name: Backend CI

on:
  push:
    paths:
      - 'services/backend/**'
  pull_request:
    paths:
      - 'services/backend/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install
        working-directory: services/backend
        run: npm install
      - name: Lint
        working-directory: services/backend
        run: npm run lint --if-present
      - name: Test
        working-directory: services/backend
        run: npm test --if-present