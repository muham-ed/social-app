name: social_app
description: منصة تواصل اجتماعي متكاملة
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_bloc: ^8.1.6
  equatable: ^3.0.0
  dartz: ^0.10.1

  # Routing
  go_router: ^14.3.0

  # DI
  get_it: ^7.7.0

  # Network
  dio: ^5.5.0
  web_socket_channel: ^3.0.3
  socket_io_client: ^3.1.6

  # Storage
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^11.2.0

  # Location
  geolocator: ^14.0.3
  geocoding: ^5.0.0

  # Media
  image_picker: ^1.1.2
  video_player: ^2.9.1
  chewie: ^1.8.3
  cached_network_image: ^3.4.1
  just_audio: ^0.10.6
  permission_handler: ^13.0.2
  record: ^7.1.1

  # Agora
  agora_rtc_engine: ^6.3.2

  # Notifications
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  flutter_local_notifications: ^22.3.1

  # UI
  flutter_svg: ^2.0.10+1
  google_fonts: ^8.2.1
  shimmer: ^3.0.0
  lottie: ^3.1.2
  intl: ^0.20.2

  # Utils
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  uuid: ^4.4.2
  logger: ^2.4.0
  connectivity_plus: ^7.3.1
  path_provider: ^2.1.4
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.11
  freezed: ^3.2.6-dev.1
  json_serializable: ^6.14.1
  bloc_test: ^9.1.7
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/